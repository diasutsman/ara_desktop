org.gradle.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=512M -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Redirect Gradle caches, transforms, and daemon to D: drive (spacious partition)
systemProp.gradle.user.home=D:/Gradle

# Disable Kotlin incremental compilation to avoid Windows multi-partition root mismatch (C: vs E:)
kotlin.incremental=false
