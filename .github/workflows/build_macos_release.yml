name: Build & Upload macOS Release PKG

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - macos-ci-build

permissions:
  contents: write

jobs:
  build-macos-pkg:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read Version from pubspec.yaml
        id: ver
        run: |
          VERSION="$(awk -F': *' '/^version:/ {print $2; exit}' pubspec.yaml | tr -d '"\r')"
          SEMVER="${VERSION%%+*}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "tag=v$SEMVER" >> "$GITHUB_OUTPUT"

      - name: Build macOS Universal PKG Installer
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh
          PKG_SRC="build/macos/ARA_Assessment_${{ steps.ver.outputs.version }}.pkg"
          if [ ! -f "$PKG_SRC" ]; then
            PKG_SRC="$(find build/macos -maxdepth 1 -name '*.pkg' | head -n 1)"
          fi
          cp -f "$PKG_SRC" "build/macos/ARA_Assessment_Setup_${{ steps.ver.outputs.tag }}.pkg"

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-pkg-installer
          path: build/macos/ARA_Assessment_Setup_${{ steps.ver.outputs.tag }}.pkg
          if-no-files-found: error

      - name: Upload PKG to GitHub Release
        if: github.repository == 'diasutsman/ara_desktop'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          PKG_FILE="build/macos/ARA_Assessment_Setup_${TAG}.pkg"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "ARA Assessment ${TAG}" --notes "ARA Assessment Desktop ${TAG}"
          fi
          gh release upload "$TAG" "$PKG_FILE" --clobber
